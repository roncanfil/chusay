# Production: the app behind Caddy, which adds HTTPS (Let's Encrypt) and one shared password.
# Lives in /opt/chusay on the server; settings come from the .env next to it (see .env.example).
services:
  app:
    image: ${CHUSAY_IMAGE:-ghcr.io/roncanfil/chusay:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/chusay.db
      BACKUP_DIR: /backups # the app copies the database here every night
    volumes:
      - chusay-data:/data
      - ./backups:/backups

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  chusay-data:
  caddy-data:
  caddy-config:
