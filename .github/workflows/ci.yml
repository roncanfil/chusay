# Every push and pull request: type-check, lint and build.
# Every push to main: also build the Docker image and publish it to GitHub Container Registry,
# then (once DEPLOY_URL and SITE_URL are set) tell the server to install it and wait until it's live.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  image:
    needs: check
    # only for this repo's main branch, never for pull requests or forks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'roncanfil/chusay'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # the app compiles once on the runner; only the small runtime layer is per platform (see Dockerfile)
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Repository variables DEPLOY_URL (the deployer's address) and SITE_URL (the app's), and the secret DEPLOY_TOKEN.
  # Without them this job is skipped, so forks and the open-source repo build fine.
  deploy:
    needs: image
    if: vars.DEPLOY_URL != '' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server to install the new image
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL/v1/update?image=ghcr.io/${{ github.repository }}&async=true"
      - name: Wait until the site runs this commit
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 60); do
            running=$(curl -fsS "$SITE_URL/api/version" | jq -r .commit) || running=unreachable
            if [ "$running" = "$GITHUB_SHA" ]; then echo "Live: $GITHUB_SHA"; exit 0; fi
            sleep 5
          done
          echo "After 5 minutes the site still runs: $running"; exit 1
